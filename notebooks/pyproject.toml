# Environment for running tfm_graficos.ipynb locally. Colab ships all of this already.
#
#     cd notebooks && poetry install
#
# Separate from the repo's own pyproject.toml (managed with uv), because the notebook only
# reads the committed results and needs none of the study's dependencies.

[project]
name = "tfm-graficos"
version = "0.1.0"
description = "Charts and paired tests for the TFM, from the committed benchmark results"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "plotly>=5.24",
    "scipy>=1.14",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbformat>=4.2.0",
    "jinja2>=3.1",
]

[tool.poetry]
package-mode = false
