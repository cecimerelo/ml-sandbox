[project]
name = "mlsandbox"
version = "0.1.0"
description = "Benchmark study for an explainable supervised-learning method recommender (TFM)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "pandas>=3.0.5",
    "openml>=0.15.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlsandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is importable so tests can assert the manifest documents every field it writes
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E,F are ruff's defaults. I keeps imports ordered, UP keeps syntax current with the
# pinned Python, B catches the bugbear class of mistakes. Enabled while the codebase
# is small so it never turns into a large reformatting diff.
select = ["E", "F", "I", "UP", "B"]
