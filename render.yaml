# Render's "Blueprint" format — lets a Render account create this service from the repo
# in one step (New > Blueprint) instead of clicking through the manual form.
#
# One service, one process: FastAPI serves the API and the built frontend together
# (api.py's FRONTEND_DIST mount), so there is nothing else to deploy alongside it.
#
# No PORT env var here on purpose: Render injects its own (10000 by default) and scans
# *that* value for an open port. The Dockerfile's CMD reads $PORT, so it always binds to
# whatever Render actually assigned. Pinning PORT to 8000 here once caused a real deploy
# to hang for the full 15-minute port-scan window with the app never actually reachable —
# it bound to the value we forced while Render kept scanning the value it assigned.
services:
  - type: web
    name: ml-sandbox
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
