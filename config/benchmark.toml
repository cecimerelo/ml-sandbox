# Single source of truth for the study's knobs.
#
# Nothing in src/ may hardcode a value that belongs here — a magic number scattered
# in a script is a reproducibility hole. Keys are added as tasks need them, not in
# advance.

[run]
# Changing this changes every fold assignment and every stochastic method.
# Record it alongside any published result.
seed = 20260815

[cv]
n_folds = 5

[paths]
# Relative to the project root. Gitignored — this is data, not source — but it is not
# disposable: it is the snapshot the study's results are computed on. D-010 publishes it.
datasets = "data/datasets"

# Anonymised session records (FR-7.3). Gitignored like the rest of `data/`, but for a
# different reason: not because it is large, because it is not ours to publish. The
# datasets and results are study artifacts anyone checking the work may have; this is a
# record of what people did.
sessions = "data/sessions.db"
